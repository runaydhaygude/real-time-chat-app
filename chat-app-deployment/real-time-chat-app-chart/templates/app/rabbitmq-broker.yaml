apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: {{ .Values.namespace }}  # Ensure this matches the namespace you're using
data:
  RABBITMQ_DEFAULT_VHOST: /
  USE_EXTERNAL_BROKER: "true"

---

apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  RABBITMQ_DEFAULT_USER: Z3Vlc3Q=  # Base64 encoded value for 'guest'
  RABBITMQ_DEFAULT_PASS: Z3Vlc3Q=  # Base64 encoded value for 'guest'


---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: runaydhaygude/rabbitmq-with-stomp:{{ .Values.image.tag }}
        imagePullPolicy: Always
        ports:
        - containerPort: 5672  # RabbitMQ main port
        - containerPort: 15672 # RabbitMQ management UI port
        - containerPort: 61613 # RabbitMQ STOMP port
        envFrom:
        - configMapRef:
            name: rabbitmq-config # Inject all keys from ConfigMap into environment variables
        - secretRef:
            name: rabbitmq-secret  # Inject all keys from Secret into environment variables


---

apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
  - name: stomp
    port: 61613
    targetPort: 61613
  selector:
    app: rabbitmq