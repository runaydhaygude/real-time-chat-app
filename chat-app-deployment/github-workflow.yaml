name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push chat-frontend
        run: |
          cd chat-frontend
          npm install
          ng build --prod
          docker build -t runaydhaygude/chat-frontend .
          docker push runaydhaygude/chat-frontend:latest

      - name: Build and push chat-user-management
        run: |
          cd chat-user-management
          mvn clean install
          docker build -t runaydhaygude/chat-user-management .
          docker push runaydhaygude/chat-user-management:latest

      - name: Build and push chat-websocket
        run: |
          cd chat-websocket
          mvn clean install
          docker build -t runaydhaygude/chat-websocket .
          docker push runaydhaygude/chat-websocket:latest